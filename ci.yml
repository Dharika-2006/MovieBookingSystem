name: Movie Booking CI/CD

on:
  push:
    branches: [ develop, master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install MLflow
      run: |
        pip install mlflow

    - name: Run MLflow Script
      run: |
        python mlflow_demo.py

    - name: Deployment Step (Simulation)
      run: |
        echo "Movie Booking System Deployed 🚀"